<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yönetici Girişi | ATOM</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
  <div class="admin-shell">
    <div class="login-card">
      <img class="admin-mascot" src="atom-karinca-mascot.png" alt="ATOM karınca maskotu">
      <span class="eyebrow">Yönetici</span>
      <h1>Giriş</h1>
      <p>Bu sayfa yalnızca yetkili yönetici içindir.</p>
      <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Yönetici şifresi">
      <button class="btn primary full" id="passwordLogin">Giriş Yap</button>
      <p id="loginMessage" class="login-error"></p>
      <p class="note">Şifre site kodunda tutulmaz; Cloudflare üzerinde gizli olarak doğrulanır.</p>
    </div>
  </div>
  <script src="config.js"></script>
  <script type="module" src="admin-login.js"></script>
</body>
</html>
